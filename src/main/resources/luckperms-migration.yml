# Anciens titres posés en suffixe LuckPerms par les menus DeluxeMenus, pour migration.luckperms-suffix.
#   text      suffixe sans codes couleur ni espaces ; « ? » remplace un émoji perdu par la base
#   title     titre de titles.yml
#   color     couleur des bords d'origine : une autre couleur veut dire la variante (couleur adaptative ou alternative)
#   variant   ce texte est la variante du titre
#   requires  code couleur présent dans le suffixe, pour départager deux titres au même texte
suffixes:
  - text: "[Lucky☘]"
    title: lucky
    color: "7"
  - text: "[Diamant]"
    title: diamant
