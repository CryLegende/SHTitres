# Titres de SHTitres, dans l'ordre du menu.
#
# Un titre :
#   category    catégorie du menu (config.yml, categories)
#   permission  permission qui fait posséder le titre (tag.<titre>)
#   icon        icône du menu : un matériau (PUMPKIN) ou une tête « basehead-<texture base64> »
#   glint       icône enchantée (true/false)
#   hidden      caché du menu tant que le joueur ne le possède pas
#   text        le titre, en MiniMessage : <gradient:#C2FF8A:#43D95B>Lucky</gradient>, <b>gras</b>, <#3FBF4F>couleur
#   border      bords prédéfinis (section borders), ou left / right écrits à la main (MiniMessage, espaces comprises)
#   animation   animation du texte (les bords restent fixes) :
#     type      wave   le dégradé du texte défile en boucle
#               shine  un reflet traverse le texte, puis une pause
#               pulse  le texte s'éclaire puis revient, comme un battement
#     seconds   durée d'un cycle
#     color     couleur du reflet ou de l'éclat (shine, pulse)
#     strength  force du reflet ou de l'éclat, de 0 à 1
#   variant     seconde version, choisie au clic droit :
#     adaptive  les bords prennent la couleur du joueur (config.yml, adaptive-color-placeholder)
#     section   autre apparence : label (nom dans le menu), text, border / left / right, animation ; ce qui manque
#               est repris du titre
#   obtain      lignes « comment l'obtenir » du menu, ou le nom d'un bloc de obtain-presets
#
# Le chat et les menus montrent la version fixe (image 0 de l'animation) ; le nametag montre l'animation.
# Garder des couleurs assez claires : le nametag a un fond sombre, &4 ou &5 purs s'y lisent mal.
# Symboles : tout caractère de la police du jeu (Unifont) marche, éviter les émojis (hors de la police des clients
# 1.19 et de Bedrock).

borders:
  crochets:
    left: "<#AAAAAA>["
    right: "<#AAAAAA>]"
  crochets-blancs:
    left: "<white>["
    right: "<white>]"
  gemme-diamant:
    left: "<#C8F6FF>⯁ "
    right: "<#C8F6FF> ⯁"

obtain-presets:
  box-cosmetiques:
    - " &8• &7Titre uniquement obtenable dans la"
    - "&7box &d&lCosmétiques"

titles:

  # ---------------------------------------------------------------------------------------------------------------
  # Titres (boxes)
  # ---------------------------------------------------------------------------------------------------------------

  lucky:
    category: titres
    permission: tag.lucky
    icon: GREEN_DYE
    left: "<#3FBF4F>☘ "
    text: "<gradient:#C2FF8A:#43D95B>Lucky</gradient>"
    right: "<#3FBF4F> ☘"
    animation:
      type: wave
      seconds: 2.4
    variant: adaptive
    obtain: box-cosmetiques

  blood:
    category: titres
    permission: tag.blood
    icon: RED_DYE
    border: crochets
    text: "<b><gradient:#FF3B3B:#B3121B>Blood</gradient></b>"
    animation:
      type: pulse
      seconds: 1.4
      color: "#FF9A9A"
      strength: 0.6
    variant: adaptive
    obtain: box-cosmetiques

  progamer:
    category: titres
    permission: tag.progamer
    icon: basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMzdjYTJhYThhOWY1ZDMyNDZlZTdmMmQwN2UxZDVmZDQ4MTkxMjVlY2RkZjVhNzJlMmY2NzUzNTVhM2I5YmNjIn19fQ==
    border: crochets
    text: "<white>Pro</white><gradient:#8AB0FF:#5C7CFF>Gamer</gradient>"
    variant: adaptive
    obtain: box-cosmetiques

  # ---------------------------------------------------------------------------------------------------------------
  # Titres spéciaux (événements, récompenses)
  # ---------------------------------------------------------------------------------------------------------------

  diamant:
    category: speciaux
    permission: tag.diamant
    icon: DIAMOND
    glint: true
    border: gemme-diamant
    text: "<gradient:#C9F7FF:#3FCBFF>Diamant</gradient>"
    animation:
      type: shine
      seconds: 3.5
      strength: 0.85
    obtain:
      - " &8• &7Titre obtenable durant"
      - "&7un événement."

  love:
    category: speciaux
    permission: tag.love
    icon: RED_CANDLE
    left: "<#FF4D6D>❤ "
    text: "<gradient:#FF8FA3:#FF2E63>Love</gradient>"
    right: "<#FF4D6D> ❤"
    animation:
      type: pulse
      seconds: 1.6
      color: "#FFD1DC"
      strength: 0.6
    variant:
      label: "Couleur alternative"
      left: "<#FF8CC6>❤ "
      text: "<gradient:#FFB3DE:#E055A0>Love</gradient>"
      right: "<#FF8CC6> ❤"
    obtain:
      - " &8• &7Titre obtenable durant"
      - "&7la Saint Valentin."

  secret:
    category: speciaux
    permission: tag.secret
    icon: BLUE_ICE
    hidden: true
    border: crochets-blancs
    text: "<b><gradient:#E6F8FF:#6FD3FF>Secret</gradient></b>"
